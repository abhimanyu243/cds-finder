[project]
name = "cds-view-finder"
version = "1.0.0"
description = "Find and rank the S/4HANA views that replace an ECC table, with business notes and a maintained table mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = ["httpx2>=2.14", "pytest>=8"]

[project.scripts]
cds-finder = "cds_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cds_finder"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]   # catalogue rows are kept on one line each

[tool.pytest.ini_options]
testpaths = ["tests"]
